<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TraitVis</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header id="bar">
      <h1>TraitVis</h1>
      <label id="drop" aria-disabled="true">
        Drop a dataset folder here. Every attribute in the folder is loaded.
        <input id="folder" type="file" webkitdirectory multiple disabled>
      </label>
      <progress id="progress" max="1" value="0" hidden></progress>
      <p id="status">Starting…</p>
      <p id="error"></p>
    </header>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <p id="webgl-fallback">WebGL2 is not available in this browser.</p>
    <script src="upload.js"></script>
    {{{ SCRIPT }}}
  </body>
</html>
